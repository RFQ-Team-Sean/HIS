<!-- login-layout component -->
<link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
<div class="gradient-background">
  <div class="cursor-gradient" (mousemove)="onMouseMove($event)">
    <div class="w-dvw h-dvh flex justify-center items-center border-none">
      <div class="w-[70%] h-[80%] relative rounded-[2rem] overflow-hidden">
          <!-- Base Container (Rounded Outer) -->
          <div class="w-full h-full bg-white flex flex-col justify-end items-center relative"></div>
  
          <!-- Sliding Left Panel (No Rounded Corners Inside) -->
          <div class="w-1/2 h-full bg-gray-100 absolute top-0 right-0 duration-300 flex flex-col 
              justify-center items-center px-10 transition-all" 
              [class.translate-x-px]="!slide" [class.-translate-x-full]="slide">
              
              <img src="assets/quanby-brandbook-1.png" class="h-auto mb-5" alt="Quanby Brand Logo">
              <p class="font-bold text-xl text-gray-800 text-center">Human Resources<br>Information System</p>
          </div>
  
          <!-- Sliding Right Panel (No Rounded Corners Inside) -->
          <div class="w-1/2 h-full bg-white absolute top-0 duration-300 flex flex-col
              justify-center px-16 border-none transition-all"
              [class.-translate-x-px]="!slide" [class.translate-x-full]="slide">
  
              <div class="w-full h-full relative">
                  @if (!slide) {
                      <app-signin [slide]="slide" (toggleSlide)="slideInOut()"></app-signin>
                  } @else {
                      <app-signup [slide]="slide" (toggleSlide)="slideInOut()"></app-signup>
                  }
              </div>
  
          </div>
      </div>
  </div>
  </div>
  </div>

      <!-- Bottom section for contact info -->
      <div class="absolute bottom-5 text-center w-full">
        <div class="flex justify-center space-x-4">
          <!-- Email -->
          <div class="flex items-center">
            <img src="assets/Email.png" alt="Email" class="h-6 w-6 mr-2 drop-shadow-lg">
            <a href="mailto:inquiries@quanbyit.com" class="text-white drop-shadow-lg">inquiriesquanbyit.com</a>
          </div>

          <!-- Facebook -->
          <div class="flex items-center">
            <img src="assets/facebook.png" alt="Facebook" class="h-6 w-6 mr-2 drop-shadow-lg">
            <a href="https://www.facebook.com/quanbysolutionsinc/" target="_blank" rel="noopener noreferrer" class="text-white drop-shadow-lg">Quanby Solutions Inc.</a>
          </div>

          <!-- Telephone -->
          <div class="flex items-center">
            <img src="assets/telno.png" alt="Telno" class="h-6 w-6 mr-2 drop-shadow-lg">
            <a class="text-white drop-shadow-lg">052 4311169 / 742 1170</a>
          </div>
        </div>
      </div>

      <!-- Buttons for each module -->
      <div class="absolute bottom-20 text-center w-full">
        <div class="flex justify-center space-x-4">
          <button 
            *ngFor="let module of modules"
            class="bg-blue-600 text-white px-4 py-2 rounded-md" 
            (click)="navigateToModule(module.path)">
            {{module.label}}
          </button>
        </div>
      </div>
