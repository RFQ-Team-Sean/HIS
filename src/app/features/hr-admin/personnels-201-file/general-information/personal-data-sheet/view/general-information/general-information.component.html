<div class="columns-3 gap-6 w-full">
  <div *ngFor="let fieldset of fieldsets" class="mb-6 border rounded-2xl shadow-md p-2 py-0 break-inside-avoid">
    <span class="block font-normal text-lg tracking-wider p-2 border-b">{{ fieldset.label }}</span>
    <div class="m-2 mt-0">
      <div *ngFor="let field of fieldset.fields" class="grid grid-cols-2 w-full justify-start hover:bg-gray-100">
        <span class="font-medium flex items-center overflow-clip overflow-ellipsis p-2">{{ field.label }}</span>
        <span id="{{ field.label }}" class="italic flex items-center p-2 overflow-clip overflow-ellipsis">{{ field.defaultValue }}</span>
        <hr class="col-span-2" *ngIf="field !== fieldset.fields[fieldset.fields.length - 1]">
      </div>
    </div>
  </div>
</div>
