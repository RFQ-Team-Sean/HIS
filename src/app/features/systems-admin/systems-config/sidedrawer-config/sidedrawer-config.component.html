<div class="fixed inset-0 bg-gray-900 bg-opacity-50 z-40" *ngIf="isOpen; close" (click)="openDrawer()" (click)="closeDrawer()"></div>

<div class="fixed right-0 top-0 h-full w-80 bg-white shadow-lg z-50 transform transition-transform duration-300" [ngClass]="{ 'translate-x-0': isOpen, 'translate-x-full': !isOpen }">
  <div class="p-4 flex justify-between items-center border-b">
    <h2 class="text-lg font-semibold">New Configuration</h2>
    <button (click)="openDrawer()" class="text-gray-500 hover:text-gray-700">&times;</button>
  </div>
  <div class="p-4">
    <!-- Organizational Section -->
     <div class="mb-6">
      <h3 class="text-md font-semibold mb-2">Organizational</h3>
      <div class="space-y-2">
        <input type="text" placeholder="Department" class="w-full p-2 border rounded"/>
        <input type="text" placeholder="Id Number Format" class="w-full p-2 border rounded"/>
      </div>
     </div>
     <!-- Personnel Section -->
      <div class="mb-6">
        <h3 class="text-md font-semibold mb-2">Personnel</h3>
        <div class="space-y-2">
          <input type="text" placeholder="Contract Types" class="w-full p-2 border rounded" />
          <input type="text" placeholder="Employment Status" class="w-full p-2 border rounded" />
        </div>
      </div>
      <!-- Timekeeping Section -->
       <div class="mb-6">
        <h3 class="text-md font-semibold mb-2">Timekeeping</h3>
        <div class="space-y-2">
          <input type="text" placeholder="Work Schedule" class="w-full p-2 border rounded" />
          <input type="text" placeholder="Calendar Types" class="w-full p-2 border rounded" />
        </div>
       </div>

       <!-- Action Buttons -->
        <!-- Action Buttons -->
    <div class="flex justify-end space-x-2">
      <button class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300" (click)="closeDrawer()">Cancel</button>
      <button class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">Save</button>
    </div>
  </div>
</div>
