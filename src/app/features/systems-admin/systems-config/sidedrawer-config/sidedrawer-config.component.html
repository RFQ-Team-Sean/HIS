<div
  class="fixed inset-0 bg-gray-900 bg-opacity-50 z-40"
  *ngIf="isOpen; close" (click)="openDrawer()"
  (click)="closeDrawer()"
></div>

<div
  class="fixed right-0 top-0 h-full w-80 bg-white shadow-lg z-50 transform transition-transform duration-300"
  [ngClass]="{ 'translate-x-0': isOpen, 'translate-x-full': !isOpen }"
>
  <div class="p-4 flex justify-between items-center border-b">
    <h2 class="text-lg font-semibold">New Configuration</h2>
    <button (click)="openDrawer()" class="text-gray-500 hover:text-gray-700">
      &times;
    </button>
  </div>
  <div class="p-4">
    <!-- Your form or content goes here -->
    <p>Add your configuration details here.</p>
  </div>
</div>
