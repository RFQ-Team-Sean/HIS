<div class="fixed inset-0 bg-gray-900 bg-opacity-50 z-40" *ngIf="isOpen; close" (click)="openDrawer()" (click)="closeDrawer()"></div>

<div class="fixed right-0 top-0 h-screen w-[516px] bg-white shadow-lg z-50 transform transition-transform duration-300" [ngClass]="{ 'translate-x-0': isOpen, 'translate-x-full': !isOpen }">
  <div class="flex justify-between items-center border-b">
    <h2 class="text-lg font-semibold">New Employee</h2>
    <button (click)="closeDrawer()" class="text-red-500 hover:text-red-700">&times;</button>
  </div>
  <!-- Form Content -->
  <div class="p-6 rounded-lg border border-indigo-500">
    <form (ngSubmit)="onSubmit()" class="space-y-6">    
      <!-- Profile Picture -->    
      <div class="flex items-center space-x-4">    
        <div class="w-32 h-32 rounded-full bg-gray-100 flex">    
          <img [src]="photoPreviewUrl" class="w-full h-full rounded-full items-center justify center">        
        </div> 
        <div class="flex flex-col">
          <h2>Your Profile Picture</h2>
          <input type="file" hidden accept="image/*" (change)="onPhotoChange($event)">
          <button for="photoInput" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">Choose</button>
        </div>
      </div>
    
  <!-- Form Fields -->
      <!-- Email Form Field -->
      <div class="gap-4 space-y-2">
        <div class="items-center grid grid-cols-[150px,1fr]">
          <label for="email" class="block text-sm font-medium text-gray-700">Email*</label> 
          <input type="email" id="email" [(ngModel)]="employee.email" name="email" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" required> 
        </div>
        <!-- Password Field -->
        <div class="items-center grid grid-cols-[150px,1fr]">
          <label class="block text-sm font-medium text-gray-700">Password*</label>
            <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="employee.password" name="password" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" required>    
              <button type="button" (click)="togglePasswordVisibility()" class="absloute inset-y-0 right-0 flex items-center pr-3">
                <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">    
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>    
                <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">    
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>    
              </button>    
        </div>    
        <!-- First Name Field -->    
        <div class="items-center grid grid-cols-[150px,1fr]">    
          <label for="firstname" class="block text-sm font-medium text-gray-700">First Name*</label>    
            <input type="text" id="firstname" [(ngModel)]="employee.firstname" name="firstname" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" required>    
        </div>
        <!-- Second Name Field -->
        <div class="items-center grid grid-cols-[150px,1fr]">    
          <label class="block text-sm font-medium text-gray-700">Middle Name</label>    
            <input type="text" id="midname" [(ngModel)]="employee.midname" name="midname" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" required>    
        </div>
        <!-- Third Name Field -->    
        <div class="items-center grid grid-cols-[150px,1fr]">    
          <label class="block text-sm font-medium text-gray-700">Last Name*</label>    
            <input type="text" id="surname" [(ngModel)]="employee.surname" name="surname" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" required>    
        </div>    
        <!-- Company Role Field -->
        <div class="items-center grid grid-cols-[150px,1fr]">
          <label class="block text-sm font-medium text-gray-700">Position*</label>    
            <select id="position" [(ngModel)]="employee.position" name="position" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" required>    
              <option [ngValue]="null">Select Position</option>    
              <option *ngFor="let role of roles" [value]="role.role_name">{{ role.role_name }}</option>    
            </select>    
        </div>
        <!-- Department Field -->    
        <div class="items-center grid grid-cols-[150px,1fr]">    
          <label class="block text-sm font-medium text-gray-700">Department*</label>    
            <select id="department" [(ngModel)]="employee.department" name="department" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" required>    
              <option value="null" disabled selected>Select Department</option>    
              <option value="it">IT</option>    
              <option value="hr">HR</option>    
              <option value="finance">Finance</option>    
              <option value="marketing">Marketing</option>    
            </select>    
        </div>
        <!-- Contract Type Field -->    
        <div class="items-center grid grid-cols-[150px,1fr]">    
          <label class="block text-sm font-medium text-gray-700">Type*</label>    
            <select id="type" [(ngModel)]="employee.type" name="type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" required>    
              <option value="null" disabled selected>Select Type</option>    
              <option value="fulltime">Full-Time</option>    
              <option value="parttime">Part-Time</option>    
              <option value="contractual">Contractual</option>    
              <option value="intern">Intern</option>    
            </select>    
        </div>
      </div>
      <!-- Action Buttons -->
      <div class="flex space-x-4 pt-4">
        <button type="button" (click)="toggleModal()" class="flex-1 px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Cancel</button>    
        <button type="submit" class="flex-1 px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed">Create</button>
      </div>    
    </form>    
  </div>    
</div>
