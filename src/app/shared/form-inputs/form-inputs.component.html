<!-- form-inputs component --> 
 <div class="flex flex-col gap-2 border-black">
    <label [for]="id" class="font-montserrat-semibold text-xs text-black">{{label}}</label>
    <div class="flex items-center relative input-wrapper border-0 !border-none">
        <input #input
            [type]="type" [name]="name" [id]="id" 
            [placeholder]="placeholder" 
            [value]="value"
            (input)="onInputChange($event)" 
            (blur)="onBlur()"
            class="font-montserrat w-full h-10 px-4 py-6 text-xs bg-transparent rounded-md 
                text-blue-600 outline-none focus:placeholder-slate-400">
        <ng-container *ngIf="type == 'password'">
            <svg class="absolute right-3 h-5 w-5 text-black cursor-pointer" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"><path fill="#fff" fill-rule="evenodd" 
                d="M10 7.642a2.355 2.355 0 0 0-2.05 3.524l3.216-3.216A2.334 2.334 0 0 0 10 7.642ZM6.392 10a3.605 3.605 0 0 1 6.158-2.55.625.625 0 0 1 0 .884L8.333 12.55a.625.625 0 0 1-.883 0A3.59 3.59 0 0 1 6.392 10Z" 
                clip-rule="evenodd"/><path fill="#fff" fill-rule="evenodd" d="M1.881 7.506C3.874 4.374 6.793 2.483 10 2.483c1.875 0 3.671.653 5.226 1.826a.625.625 0 1 1-.753.998C13.112 4.28 11.575 3.733 10 3.733c-2.677 0-5.24 1.576-7.064 4.444h-.001c-.295.464-.464 1.126-.464 1.827 0 .7.169 1.363.464 1.826.628.986 1.356 1.83 2.14 2.504a.625.625 0 1 1-.816.948 12.56 12.56 0 0 1-2.378-2.78c-.454-.712-.66-1.624-.66-2.498 0-.874.206-1.786.66-2.498ZM16.317 6.121a.625.625 0 0 1 .878.096c.32.397.634.825.924 1.281.454.712.66 1.624.66 2.498 0 .874-.206 1.786-.66 2.498-1.993 3.132-4.912 5.023-8.12 5.023a8.304 8.304 0 0 1-3.225-.666.625.625 0 0 1 .485-1.152c.879.37 1.805.568 2.74.568 2.677 0 5.241-1.576 7.065-4.444v-.001c.296-.463.465-1.126.465-1.826 0-.7-.169-1.364-.464-1.826l-.001-.002c-.26-.41-.546-.8-.843-1.168a.625.625 0 0 1 .096-.879Z" clip-rule="evenodd"/><path fill="#fff" fill-rule="evenodd" d="M13.038 9.969c.34.062.564.388.502.728a3.596 3.596 0 0 1-2.852 2.85.625.625 0 1 1-.227-1.228c.92-.17 1.68-.929 1.85-1.85a.625.625 0 0 1 .727-.5ZM7.942 12.058a.625.625 0 0 1 0 .884l-4.167 4.167a.625.625 0 0 1-.884-.884l4.167-4.167a.625.625 0 0 1 .884 0ZM17.108 2.891a.625.625 0 0 1 0 .884l-4.166 4.167a.625.625 0 0 1-.884-.884l4.167-4.167a.625.625 0 0 1 .883 0Z" clip-rule="evenodd"/></svg>

    </div>
    
</div>
